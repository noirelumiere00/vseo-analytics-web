<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok VSEOスマホモック</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --border:#222230;
  --tt-black:#010101;
  --tt-red:#fe2c55;
  --tt-teal:#25f4ee;
  --text:#f0f0f0;
  --muted:#888;
}
body{
  font-family:-apple-system,'Hiragino Sans',BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:32px 24px 64px;
}

/* ─── Header ─── */
.header{
  text-align:center;
  margin-bottom:40px;
}
.header-logo{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.header-logo svg{width:32px;height:32px}
.header h1{
  font-size:13px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.header-sub{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(135deg,#fe2c55,#25f4ee);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-top:6px;
}

/* ─── KW tabs ─── */
.kw-tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:48px;
  flex-wrap:wrap;
}
.kw-tab{
  padding:8px 20px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  transition:all .2s;
  letter-spacing:.05em;
}
.kw-tab.active{
  background:linear-gradient(135deg,#fe2c55,#ee1d52);
  border-color:transparent;
  color:white;
  box-shadow:0 4px 16px rgba(254,44,85,.3);
}
.kw-tab:hover:not(.active){
  border-color:#444;
  color:var(--text);
}

/* ─── Stage ─── */
.stage{
  display:none;
}
.stage.active{
  display:block;
}
.stage-inner{
  display:flex;
  gap:48px;
  align-items:flex-start;
  justify-content:center;
  flex-wrap:wrap;
}

/* ─── Stats ─── */
.stats-panel{
  flex:0 0 280px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.stats-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
}
.stat-val{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(135deg,#fe2c55,#ee1d52);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.stat-lbl{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
  letter-spacing:.05em;
}
.top-list{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.top-list-hdr{
  padding:12px 16px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--border);
}
.top-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .15s;
  text-decoration:none;
  color:inherit;
}
.top-item:last-child{border-bottom:none}
.top-item:hover{background:rgba(255,255,255,.03)}
.top-rank{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  width:16px;
  text-align:center;
  flex-shrink:0;
}
.top-rank.gold{color:#FFD700}
.top-rank.silver{color:#C0C0C0}
.top-rank.bronze{color:#CD7F32}
.top-avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#000;
  flex-shrink:0;
}
.top-info{flex:1;min-width:0}
.top-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-views{font-size:10px;color:var(--muted);margin-top:1px}
.promo-badge{
  font-size:8px;font-weight:700;
  background:#fe2c55;color:white;
  padding:1px 5px;border-radius:4px;
  flex-shrink:0;
}

/* ─── Phone ─── */
.phone-wrap{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.phone-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
}
.phone{
  position:relative;
  width:240px;
  height:520px;
  filter:drop-shadow(0 16px 40px rgba(0,0,0,.6));
}
/* Side buttons */
.btn-l1{position:absolute;left:-3px;top:80px;width:3px;height:16px;border-radius:1.5px 0 0 1.5px;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.btn-l2{position:absolute;left:-3px;top:112px;width:3px;height:21px;border-radius:1.5px 0 0 1.5px;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.btn-l3{position:absolute;left:-3px;top:138px;width:3px;height:21px;border-radius:1.5px 0 0 1.5px;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.btn-r1{position:absolute;right:-3px;top:122px;width:3px;height:26px;border-radius:0 1.5px 1.5px 0;background:linear-gradient(180deg,#48484a,#2c2c2e)}

.frame{
  position:relative;width:100%;height:100%;border-radius:32px;padding:3px;
  background:linear-gradient(170deg,#48484a 0%,#3a3a3c 15%,#2c2c2e 40%,#1c1c1e 60%,#2c2c2e 80%,#3a3a3c 100%);
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,.06),inset 0 -1px 0 0 rgba(255,255,255,.03);
}
.bezel{
  position:relative;width:100%;height:100%;border-radius:30px;
  border:1px solid #050505;background:#000;overflow:hidden;
}
.di{
  position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:20;
  width:68px;height:20px;background:black;border-radius:999px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 3px rgba(0,0,0,.4);
}
.glass{
  position:absolute;inset:0;border-radius:28px;z-index:30;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 30%,transparent 50%);
}
.screen{
  width:100%;height:100%;border-radius:28px;overflow:hidden;
  background:#000;display:flex;flex-direction:column;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
}

/* Status bar */
.sbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;height:26px;flex-shrink:0;
}
.sbar-time{font-size:9px;font-weight:600;color:white;margin-top:10px;letter-spacing:-.3px}
.sbar-icons{display:flex;align-items:center;gap:3px;margin-top:10px}

/* Search bar */
.search-row{
  display:flex;align-items:center;gap:5px;
  padding:0 7px 4px;flex-shrink:0;
}
.search-back{flex-shrink:0}
.search-input{
  flex:1;display:flex;align-items:center;gap:5px;
  background:#1e1e1e;border-radius:999px;
  padding:5px 8px;
}
.search-kw{font-size:9px;color:white;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.search-btn{font-size:8px;color:white;font-weight:500;flex-shrink:0}

/* Tabs */
.tabs{
  display:flex;align-items:flex-end;
  border-bottom:1px solid #1a1a1a;
  padding:3px 0 0;flex-shrink:0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:3px;
}
.tab-lbl{font-size:8px;white-space:nowrap}
.tab-lbl.active{color:white;font-weight:700}
.tab-lbl.inactive{color:#606060;font-weight:500}
.tab-bar{width:14px;height:2px;background:white;border-radius:999px}

/* Filter chips */
.chips{
  display:flex;align-items:center;gap:3px;
  padding:3px 5px;flex-shrink:0;
}
.chip{
  padding:2px 8px;border-radius:999px;font-size:6px;
}
.chip.on{background:white;color:black;font-weight:700}
.chip.off{background:#1e1e1e;color:#b0b0b0}

/* Grid */
.grid-wrap{
  flex:1;overflow:hidden;background:#080808;position:relative;
}
.grid-scroll{
  position:absolute;inset:0;overflow-y:auto;
  scrollbar-width:none;
}
.grid-scroll::-webkit-scrollbar{display:none}
.vgrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;
}
.vcell{
  aspect-ratio:9/14;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.vcell-bg{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
}
.vcell-init{
  font-size:14px;font-weight:900;color:#000;
  opacity:.8;
}
.vcell-overlay{
  position:absolute;bottom:0;left:0;right:0;
  padding:3px 3px 2px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
}
.vcell-views{font-size:6px;color:rgba(255,255,255,.85);font-weight:700;line-height:1}
.vcell-dur{font-size:5.5px;color:rgba(255,255,255,.6);line-height:1;margin-top:1px}
.vcell-promo{
  position:absolute;top:3px;right:3px;
  font-size:5px;font-weight:700;
  background:#fe2c55;color:white;
  padding:1px 3px;border-radius:3px;
}
.grid-fade{
  position:absolute;bottom:0;left:0;right:0;height:24px;
  background:linear-gradient(transparent,black);
  pointer-events:none;z-index:5;
}

/* Bottom nav */
.bnav{
  display:flex;align-items:center;justify-content:space-around;
  padding:5px 4px 2px;background:black;flex-shrink:0;
}
.bnav-item{
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.bnav-lbl{font-size:5px;color:#8a8a8a}

/* ─── Tooltip on hover ─── */
.vcell:hover .vtip{display:block}
.vtip{
  display:none;
  position:absolute;bottom:0;left:0;right:0;top:0;
  background:rgba(0,0,0,.82);
  padding:4px;
  z-index:10;
}
.vtip-name{font-size:6px;font-weight:700;color:white;line-height:1.3}
.vtip-title{font-size:5.5px;color:rgba(255,255,255,.7);line-height:1.3;margin-top:2px}
.vtip-row{display:flex;gap:6px;margin-top:4px}
.vtip-stat{font-size:6px;color:#fe2c55;font-weight:700}
.vtip-tags{margin-top:3px;display:flex;flex-wrap:wrap;gap:2px}
.vtip-tag{font-size:5px;background:rgba(254,44,85,.2);color:#fe2c55;padding:1px 3px;border-radius:3px}

</style>
</head>

function fmtNum(n) {
  if (!n || n === 0) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 10000) return Math.floor(n/10000) + '万';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

function initials(name) {
  if (!name) return '?';
  const c = name.replace(/[@|｜\s].*/, '').trim();
  return c.charAt(0).toUpperCase() || '?';
}

function buildStats(vids) {
  const totalViews = vids.reduce((s,v)=>s+(v.rv||0),0);
  const totalLikes = vids.reduce((s,v)=>s+(parseInt(v.l)||0),0);
  const promoCount = vids.filter(v=>v.promo).length;
  const avgQ = (vids.reduce((s,v)=>s+(v.q||0),0)/vids.length).toFixed(1);
  
  const top5 = vids.slice(0,5);
  const ranks = ['gold','silver','bronze','',''];
  
  return `
    <div class="stats-panel">
      <div class="stats-title">サマリー統計</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val">${fmtNum(totalViews)}</div>
          <div class="stat-lbl">総再生数</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${vids.length}</div>
          <div class="stat-lbl">動画本数</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${fmtNum(Math.round(totalViews/vids.length))}</div>
          <div class="stat-lbl">平均再生数</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="background:linear-gradient(135deg,#25f4ee,#4ECDC4);-webkit-background-clip:text">${avgQ}</div>
          <div class="stat-lbl">平均品質スコア</div>
        </div>
      </div>
      
      <div class="top-list">
        <div class="top-list-hdr">再生数 TOP 5</div>
        ${top5.map((v,i)=>{
          const initial = v.n ? v.n.replace(/[@|｜\s].*/, '').trim().charAt(0) : '?';
          return `
          <a class="top-item" href="${v.url}" target="_blank" rel="noopener">
            <span class="top-rank ${ranks[i]}">${i+1}</span>
            <div class="top-avatar" style="background:${v.color}">${initial}</div>
            <div class="top-info">
              <div class="top-name">${v.n}</div>
              <div class="top-views">▶ ${v.v} · フォロワー ${v.f}</div>
            </div>
            ${v.promo ? '<span class="promo-badge">PR</span>' : ''}
          </a>`;
        }).join('')}
      </div>
      
      <div style="font-size:10px;color:var(--muted);text-align:center;line-height:1.6">
        セルをホバーすると詳細表示<br>
        セルをクリックでTikTok動画を開く
      </div>
    </div>`;
}

function render() {
  const tabsEl = document.getElementById('kwTabs');
  const stagesEl = document.getElementById('stages');
  
  DATA.forEach((d, idx) => {
    const tab = document.createElement('button');
    tab.className = 'kw-tab' + (idx===0?' active':'');
    tab.textContent = d.kw;
    tab.onclick = () => {
      document.querySelectorAll('.kw-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('stage-'+idx).classList.add('active');
    };
    tabsEl.appendChild(tab);
    
    const stage = document.createElement('div');
    stage.className = 'stage' + (idx===0?' active':'');
    stage.id = 'stage-'+idx;
    stage.innerHTML = `
      <div class="stage-inner">
        ${buildStats(d.vids)}
        <div class="phone-wrap">
          <div class="phone-label">TikTok 検索結果 / ${d.kw}</div>
          ${buildPhone(d.kw, d.vids)}
        </div>
      </div>`;
    stagesEl.appendChild(stage);
  });
}

render();
</script>
</body>
