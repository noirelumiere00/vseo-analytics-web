<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok VSEOスマホモック — 検索結果確認</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --border:#1e1e2e;
  --tt-red:#fe2c55;
  --tt-teal:#25f4ee;
  --text:#f0f0f0;
  --muted:#666;
  --highlight-red:#fe2c55;
}
body{
  font-family:-apple-system,'Hiragino Sans',BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:28px 24px 80px;
}

/* ─── Header ─── */
.hdr{text-align:center;margin-bottom:32px}
.hdr-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-icon{width:28px;height:28px;border-radius:6px;background:var(--tt-red);display:flex;align-items:center;justify-content:center}
.hdr-sub{
  font-size:24px;font-weight:900;
  background:linear-gradient(90deg,#fe2c55,#25f4ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hdr-desc{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.05em}

/* ─── Status bar ─── */
.status-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:28px;flex-wrap:wrap;
}
.status-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--border);
}
.dot{width:7px;height:7px;border-radius:50%}
.dot-loading{background:#666;animation:pulse 1s infinite}
.dot-done{background:#22c55e}
.dot-red{background:var(--tt-red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#resolveStatus{color:var(--muted)}

/* ─── Phones stage ─── */
.phones-stage{
  display:flex;
  gap:20px;
  justify-content:center;
  align-items:flex-start;
  overflow-x:auto;
  padding:4px 0 16px;
}

/* ─── Phone card ─── */
.phone-card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  flex:0 0 auto;
}
.phone-kw{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);
}
.phone{
  position:relative;
  width:216px;height:468px;
  filter:drop-shadow(0 12px 32px rgba(0,0,0,.55));
}

/* Buttons */
.bl1,.bl2,.bl3{position:absolute;left:-3px;border-radius:1.5px 0 0 1.5px;width:3px;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.bl1{top:76px;height:15px}
.bl2{top:104px;height:20px}
.bl3{top:129px;height:20px}
.br1{position:absolute;right:-3px;top:112px;width:3px;height:24px;border-radius:0 1.5px 1.5px 0;background:linear-gradient(180deg,#48484a,#2c2c2e)}

.frame{
  width:100%;height:100%;border-radius:30px;padding:3px;
  background:linear-gradient(160deg,#48484a,#3a3a3c 15%,#2c2c2e 40%,#1c1c1e 60%,#2c2c2e 80%,#3a3a3c);
}
.bezel{
  width:100%;height:100%;border-radius:28px;
  border:1px solid #050505;background:#000;overflow:hidden;position:relative;
}
.di{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:20;
  width:64px;height:18px;background:black;border-radius:999px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);
}
.glass{
  position:absolute;inset:0;border-radius:26px;z-index:30;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 30%,transparent 50%);
}
.screen{
  width:100%;height:100%;border-radius:26px;overflow:hidden;
  background:#000;display:flex;flex-direction:column;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
}

/* Status bar inside phone */
.sbar{display:flex;align-items:center;justify-content:space-between;padding:0 17px;height:25px;flex-shrink:0}
.sbar-t{font-size:8.5px;font-weight:700;color:white;margin-top:10px;letter-spacing:-.3px}
.sbar-i{display:flex;align-items:center;gap:2.5px;margin-top:10px}

/* Search */
.srow{display:flex;align-items:center;gap:4px;padding:0 6px 3px;flex-shrink:0}
.sinput{flex:1;display:flex;align-items:center;gap:4px;background:#1e1e1e;border-radius:999px;padding:4px 8px}
.skw{font-size:8.5px;color:white;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.sbtn{font-size:7.5px;color:white;font-weight:500;flex-shrink:0}

/* Tabs */
.tabs{display:flex;align-items:flex-end;border-bottom:1px solid #1a1a1a;padding:3px 0 0;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:3px}
.tlbl{font-size:7.5px;white-space:nowrap}
.tlbl.a{color:white;font-weight:700}
.tlbl.i{color:#555;font-weight:500}
.tbar{width:13px;height:2px;background:white;border-radius:999px}

/* Chips */
.chips{display:flex;gap:3px;padding:3px 5px;flex-shrink:0}
.chip{padding:2px 8px;border-radius:999px;font-size:6px}
.chip.on{background:white;color:black;font-weight:700}
.chip.off{background:#1e1e1e;color:#aaa}

/* Grid */
.gwrap{flex:1;overflow:hidden;background:#050505;position:relative}
.gscroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.gfade{position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(transparent,black);pointer-events:none;z-index:5}

/* Video cell */
.vcell{
  aspect-ratio:9/14;position:relative;overflow:hidden;cursor:pointer;
  transition:opacity .15s;
}
.vcell:hover{opacity:.88}
.vcell-thumb{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#000;opacity:.7;
}
.vcell-thumb img{
  width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;
  transition:opacity .3s;
}
.vcell-thumb img.loaded{opacity:1}
.vcell-thumb img:not(.loaded){opacity:0}
.vcell-overlay{
  position:absolute;bottom:0;left:0;right:0;
  padding:4px 3px 3px;
  background:linear-gradient(transparent,rgba(0,0,0,.75));
  z-index:2;
}
.vcell-views{font-size:6.5px;color:rgba(255,255,255,.9);font-weight:700;line-height:1}
.vcell-dur{font-size:5.5px;color:rgba(255,255,255,.6);margin-top:1px;line-height:1}
.vcell-promo{
  position:absolute;top:3px;right:3px;z-index:3;
  font-size:5px;font-weight:800;
  background:var(--tt-red);color:white;
  padding:1px 3px;border-radius:3px;
}

/* ★ My video highlight */
.vcell.my-video{
  box-shadow:0 0 0 2.5px var(--tt-red) inset;
  z-index:4;
}
.vcell.my-video::after{
  content:'自社';
  position:absolute;top:3px;left:3px;z-index:5;
  font-size:5px;font-weight:800;
  background:var(--tt-red);color:white;
  padding:1px 3px;border-radius:3px;
}

/* Hover tooltip */
.vcell:hover .vtip{display:flex}
.vtip{
  display:none;flex-direction:column;gap:2px;
  position:absolute;inset:0;background:rgba(0,0,0,.85);
  padding:5px;z-index:10;
}
.vt-name{font-size:6.5px;font-weight:700;color:white;line-height:1.3}
.vt-title{font-size:5.5px;color:rgba(255,255,255,.65);line-height:1.3;flex:1;overflow:hidden}
.vt-stats{display:flex;gap:5px;flex-wrap:wrap}
.vt-stat{font-size:5.5px;color:var(--tt-teal);font-weight:700}
.vt-tags{display:flex;flex-wrap:wrap;gap:2px}
.vt-tag{font-size:5px;background:rgba(254,44,85,.2);color:var(--tt-red);padding:1px 3px;border-radius:3px}

/* Bottom nav */
.bnav{display:flex;align-items:center;justify-content:space-around;padding:5px 4px 3px;background:black;flex-shrink:0}
.bni{display:flex;flex-direction:column;align-items:center;gap:1px}
.bnl{font-size:4.5px;color:#8a8a8a}
.create-btn{width:28px;height:20px;border-radius:5px;background:linear-gradient(90deg,#25f4ee,white,#fe2c55);display:flex;align-items:center;justify-content:center}

/* ─── Stats below phone ─── */
.phone-stats{width:216px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ps-row{display:flex;justify-content:space-between;margin-bottom:5px}
.ps-item{text-align:center}
.ps-val{font-size:14px;font-weight:800;background:linear-gradient(135deg,#fe2c55,#ee1d52);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps-lbl{font-size:9px;color:var(--muted)}
.ps-match{
  font-size:10px;font-weight:700;
  color:var(--tt-red);text-align:center;
  margin-top:6px;padding-top:6px;
  border-top:1px solid var(--border);
}

/* ─── Legend ─── */
.legend{
  display:flex;align-items:center;justify-content:center;gap:20px;
  margin-bottom:20px;flex-wrap:wrap;
}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg-box{width:14px;height:14px;border-radius:3px;border:2px solid var(--tt-red);position:relative}
.leg-box::after{content:'自社';position:absolute;top:-1px;left:-1px;font-size:5px;font-weight:800;background:var(--tt-red);color:white;padding:1px 2px;border-radius:2px}
.leg-box2{width:14px;height:14px;border-radius:3px;background:#1e1e1e;border:1px solid #333}

</style>
</head>

function fmtNum(n) {
  if (!n) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 10000) return Math.floor(n/10000)+'万';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return String(n);
}

function initials(name) {
  return (name||'?').replace(/[@|｜\s].*/,'').trim().charAt(0) || '?';
}

// ── oEmbed: resolve posted URLs & get video IDs ──────────────
const myVideoIds = new Set();
const thumbCache = {};  // videoId → thumbnailUrl

// Extract video IDs from full URLs immediately
POSTED_URLS.forEach(u => {
  const m = u.match(/\/video\/(\d+)/);
  if (m) myVideoIds.add(m[1]);
});

async function resolveUrl(url) {
  try {
    const resp = await fetch(
      `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`,
      {mode:'cors'}
    );
    if (!resp.ok) return null;
    const d = await resp.json();
    // Extract video ID from html or author_url
    const m = (d.html||d.author_url||'').match(/\/video\/(\d+)/);
    const vid = m ? m[1] : null;
    if (vid && d.thumbnail_url) thumbCache[vid] = d.thumbnail_url;
    return {vid, thumb: d.thumbnail_url};
  } catch(e) { return null; }
}

async function resolveAllPosted() {
  const shortUrls = POSTED_URLS.filter(u => u.includes('vt.tiktok.com'));
  const results = await Promise.allSettled(shortUrls.map(resolveUrl));
  let resolved = 0;
  results.forEach((r,i) => {
    if (r.status === 'fulfilled' && r.value?.vid) {
      myVideoIds.add(r.value.vid);
      resolved++;
    }
  });
  return resolved;
}

// ── Thumbnail loading for Excel videos ──────────────────────
const thumbLoadQueue = [];
let thumbLoadIndex = 0;

async function loadThumb(vid, url) {
  if (!vid || !url || thumbCache[vid]) return;
  try {
    const resp = await fetch(
      `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`,
      {mode:'cors'}
    );
    if (resp.ok) {
      const d = await resp.json();
      if (d.thumbnail_url) {
        thumbCache[vid] = d.thumbnail_url;
        applyThumb(vid, d.thumbnail_url);
      }
    }
  } catch(e) {}
}

function applyThumb(vid, thumbUrl) {
  document.querySelectorAll(`[data-vid="${vid}"] img.thumb`).forEach(img => {
    img.onload = () => img.classList.add('loaded');
    img.src = thumbUrl;
  });
}

async function processThumbQueue() {
  while (thumbLoadIndex < thumbLoadQueue.length) {
    const item = thumbLoadQueue[thumbLoadIndex++];
    await loadThumb(item.vid, item.url);
    await new Promise(r => setTimeout(r, 120)); // rate limit
  }
}

  const {kw, vids} = kwData;
  const totalViews = vids.reduce((s,v)=>s+(v.rv||0),0);
  
  const cells = vids.map((v, i) => {
    const rank = i + 1;
    const vid = v.vid || '';
    if (vid) thumbLoadQueue.push({vid, url: v.url});
    
    const tip = `
      <div class="vtip">
        <div class="vt-name">${rank}. @${v.id}</div>
        <div class="vt-title">${v.t || '(タイトルなし)'}</div>
        <div class="vt-stats">
          <span class="vt-stat">▶ ${v.v}</span>
          <span class="vt-stat">♥ ${v.l}</span>
          <span class="vt-stat">⬇ ${v.sv}</span>
        </div>
        <div class="vt-tags">${(v.tags||[]).map(t=>`<span class="vt-tag">#${t}</span>`).join('')}</div>
      </div>`;
    
    return `
      <a class="vcell" href="${v.url}" target="_blank" rel="noopener"
         data-vid="${vid}" data-my="0">
        <div class="vcell-thumb" style="background:${v.color}">
          <span class="bg-init">${initials(v.n)}</span>
          <img class="thumb" src="" alt="" loading="lazy"/>
        </div>
        ${v.promo ? '<div class="vcell-promo">PR</div>' : ''}
        <div class="vcell-overlay">
          <div class="vcell-views">▶ ${v.v}</div>
          <div class="vcell-dur">${v.d}</div>
        </div>
        ${tip}
      </a>`;
  }).join('');

  return `
    <div class="phone-card">
      <div class="phone-kw">${kw}</div>
      <div class="phone">
        <div class="bl1"></div><div class="bl2"></div><div class="bl3"></div><div class="br1"></div>
        <div class="frame"><div class="bezel">
          <div class="di"></div><div class="glass"></div>
          <div class="screen">
            <!-- Status bar -->
            <div class="sbar">
              <span class="sbar-t">9:41</span>
              <div class="sbar-i">
                <svg width="12" height="7" viewBox="0 0 12 7" fill="none">
                  <rect x="0" y="5" width="2" height="2" rx=".4" fill="white"/>
                  <rect x="2.8" y="3.5" width="2" height="3.5" rx=".4" fill="white"/>
                  <rect x="5.6" y="1.5" width="2" height="5.5" rx=".4" fill="white"/>
                  <rect x="8.4" y="0" width="2" height="7" rx=".4" fill="white"/>
                </svg>
                <svg width="15" height="8" viewBox="0 0 15 8" fill="none">
                  <rect x=".5" y=".5" width="11" height="7" rx="2" stroke="white" stroke-width=".8" opacity=".4"/>
                  <rect x="1.5" y="1.5" width="9" height="5" rx="1" fill="white"/>
                  <path d="M12.5 2.8v2.4a1 1 0 000-2.4Z" fill="white" opacity=".4"/>
                </svg>
              </div>
            </div>
            <!-- Search row -->
            <div class="srow">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M7 1.5L3 5L7 8.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <div class="sinput">
                <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
                  <circle cx="3.5" cy="3.5" r="2.5" stroke="#666" stroke-width=".85"/>
                  <path d="M5.5 5.5L7.2 7.2" stroke="#666" stroke-width=".85" stroke-linecap="round"/>
                </svg>
                <span class="skw">${kw}</span>
                <div style="width:10px;height:10px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center">
                  <svg width="6" height="6" viewBox="0 0 6 6" fill="none"><path d="M1.2 1.2L4.8 4.8M4.8 1.2L1.2 4.8" stroke="white" stroke-width=".8" stroke-linecap="round"/></svg>
                </div>
              </div>
              <span class="sbtn">検索</span>
            </div>
            <!-- Tabs -->
            <div class="tabs">
              ${["トップ","動画","ユーザー","サウンド","LIVE"].map((t,i)=>`
              <div class="tab">
                <span class="tlbl ${i===0?'a':'i'}">${t}</span>
                ${i===0?'<div class="tbar"></div>':''}
              </div>`).join('')}
            </div>
            <!-- Chips -->
            <div class="chips">
              ${["関連度順","いいね数順","最新順"].map((c,i)=>`
              <div class="chip ${i===0?'on':'off'}">${c}</div>`).join('')}
            </div>
            <!-- Grid -->
            <div class="gwrap">
              <div class="gscroll" id="grid-${kw}">
                <div class="vgrid">${cells}</div>
              </div>
              <div class="gfade"></div>
            </div>
            <!-- Bottom nav -->
            <div class="bnav">
              <div class="bni">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 5.5L6 1.5L10.5 5.5V10.5H7.5V7.5H4.5V10.5H1.5V5.5Z" fill="white" opacity=".55"/></svg>
                <span class="bnl">ホーム</span>
              </div>
              <div class="bni">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="4" r="2.2" stroke="white" stroke-width=".85" opacity=".55"/><path d="M1 11c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="white" stroke-width=".85" opacity=".55"/></svg>
                <span class="bnl">友達</span>
              </div>
              <div class="bni">
                <div class="create-btn">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="black" stroke-width="1.8" stroke-linecap="round"/></svg>
                </div>
              </div>
              <div class="bni">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="4.5" r="2.5" stroke="white" stroke-width=".85" opacity=".55"/><path d="M5 8v3M3 8h4" stroke="white" stroke-width=".85" opacity=".55"/></svg>
                <span class="bnl">検索</span>
              </div>
              <div class="bni">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="white" stroke-width=".85" opacity=".55"/></svg>
                <span class="bnl">受信BOX</span>
              </div>
            </div>
          </div><!-- /screen -->
        </div></div><!-- /bezel /frame -->
      </div><!-- /phone -->
      <div class="phone-stats" id="stats-${kw}">
        <div class="ps-row">
          <div class="ps-item"><div class="ps-val">${fmtNum(totalViews)}</div><div class="ps-lbl">総再生数</div></div>
          <div class="ps-item"><div class="ps-val">${vids.length}</div><div class="ps-lbl">動画数</div></div>
          <div class="ps-item"><div class="ps-val">${fmtNum(Math.round(totalViews/vids.length))}</div><div class="ps-lbl">平均再生数</div></div>
        </div>
        <div class="ps-match" id="match-${kw}">確認中...</div>
      </div>
    </div>`;
}

// ── Apply highlights after IDs are resolved ─────────────────
function applyHighlights() {
  let totalMatches = 0;
  DATA.forEach(kwData => {
    const {kw, vids} = kwData;
    let kwMatches = 0;
    vids.forEach(v => {
      if (v.vid && myVideoIds.has(v.vid)) {
        document.querySelectorAll(`[data-vid="${v.vid}"]`).forEach(el => {
          el.classList.add('my-video');
        });
        kwMatches++;
        totalMatches++;
      }
    });
    const matchEl = document.getElementById(`match-${kw}`);
    if (matchEl) {
      matchEl.textContent = kwMatches > 0
        ? `✅ 自社動画 ${kwMatches}本が検索結果に入っています`
        : `自社動画は検索結果に見当たりませんでした`;
      matchEl.style.color = kwMatches > 0 ? 'var(--tt-red)' : '#555';
    }
  });
  
  const matchEl = document.getElementById('matchText');
  const matchChip = document.getElementById('matchStatus');
  if (matchEl) matchEl.textContent = totalMatches > 0
    ? `全体で ${totalMatches} 本が検索結果に入っていました`
    : `検索結果への掲載は確認できませんでした`;
  if (matchChip) matchChip.style.display = 'flex';
}

// ── Main ────────────────────────────────────────────────────
async function main() {
  // Render phones
  const stage = document.getElementById('phonesStage');
  stage.innerHTML = DATA.map(buildPhone).join('');
  
  // Resolve posted URLs
  const resolved = await resolveAllPosted();
  
  const dotEl = document.getElementById('resolveDot');
  const textEl = document.getElementById('resolveText');
  if (dotEl) dotEl.className = 'dot dot-done';
  if (textEl) textEl.textContent = `短縮URL ${resolved}本 解決完了`;
  
  // Apply highlights
  applyHighlights();
  
  // Load thumbnails (background)
  processThumbQueue();
}

main();
</script>
