<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram VSEOスマホモック — リール検索結果確認</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--surface:#f0f0f0;--border:#dbdbdb;
  --ig-pink:#e1306c;
  --ig-grad:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
  --text:#262626;--muted:#8e8e8e
}
body{font-family:-apple-system,'Hiragino Sans',BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px 24px 80px}

.hdr{text-align:center;margin-bottom:24px}
.hdr-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-icon{width:28px;height:28px;border-radius:8px;background:var(--ig-grad);display:flex;align-items:center;justify-content:center}
.hdr-badge{font-size:11px;font-weight:700;letter-spacing:.15em;color:#999}
.hdr-sub{font-size:24px;font-weight:900;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-desc{font-size:12px;color:var(--muted);margin-top:6px}

.result-banner{max-width:960px;margin:0 auto 22px;background:#fff5f8;border:1.5px solid var(--ig-pink);border-radius:12px;padding:16px 22px}
.rb-title{font-size:13px;font-weight:800;color:var(--ig-pink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rb-kw{font-size:12px;margin-bottom:6px}
.rb-kw strong{color:var(--ig-pink)}.rb-kw span{color:#333}
.rb-kw.none strong{color:#bbb}.rb-kw.none span{color:#bbb}
.rb-note{font-size:11px;color:#999;margin-top:10px;padding-top:10px;border-top:1px solid #fce;display:flex;align-items:center;gap:6px}

.legend{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg-my{width:14px;height:14px;border-radius:3px;border:2.5px solid var(--ig-pink);background:#fff5f8;position:relative;flex-shrink:0}
.leg-my::after{content:'自社';position:absolute;top:-1px;left:-1px;font-size:4.5px;font-weight:800;background:var(--ig-pink);color:white;padding:1px 2px;border-radius:2px}
.leg-normal{width:14px;height:14px;border-radius:3px;background:#f0f0f0;border:1px solid #ddd;flex-shrink:0}

.phones-stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;overflow-x:auto;padding:4px 0 16px}
.phone-card{display:flex;flex-direction:column;align-items:center;gap:12px;flex:0 0 auto}
.phone-kw{font-size:11px;font-weight:700;color:#555;background:#fff;border:1px solid var(--border);padding:4px 14px;border-radius:999px}

/* ──────────────────────────────
   iPhone 15 Pro frame
────────────────────────────── */
.phone{
  position:relative;
  width:216px;height:468px;
  filter:
    drop-shadow(0 18px 48px rgba(0,0,0,.2))
    drop-shadow(0 4px 12px rgba(0,0,0,.12))
    drop-shadow(0 1px 3px rgba(0,0,0,.1));
}

/* Hardware buttons */
.phbtn{position:absolute}
/* Left: silent switch */
.phbtn-l0{left:-2.5px;top:70px;width:2.5px;height:14px;
  background:linear-gradient(90deg,#6c6c70,#b0b0b4 50%,#7c7c80);
  border-radius:1.5px 0 0 1.5px}
/* Left: vol + */
.phbtn-l1{left:-2.5px;top:92px;width:2.5px;height:26px;
  background:linear-gradient(90deg,#6c6c70,#b0b0b4 50%,#7c7c80);
  border-radius:1.5px 0 0 1.5px}
/* Left: vol - */
.phbtn-l2{left:-2.5px;top:124px;width:2.5px;height:26px;
  background:linear-gradient(90deg,#6c6c70,#b0b0b4 50%,#7c7c80);
  border-radius:1.5px 0 0 1.5px}
/* Right: power */
.phbtn-r{right:-2.5px;top:108px;width:2.5px;height:36px;
  background:linear-gradient(90deg,#b0b0b4,#6c6c70 50%,#8c8c90);
  border-radius:0 1.5px 1.5px 0}

/* Titanium outer frame */
.frame{
  width:100%;height:100%;
  border-radius:38px;
  padding:3px;
  background:linear-gradient(152deg,
    #d0d0d4 0%,   #888890 7%,
    #c8c8cc 16%,  #9a9aa0 25%,
    #dcdce0 36%,  #8e8e94 48%,
    #d4d4d8 60%,  #929298 70%,
    #cecece 80%,  #b0b0b6 89%,
    #d6d6da 100%
  );
}

/* Inner black ring */
.bezel{
  width:100%;height:100%;
  border-radius:35px;
  background:#0a0a0a;
  padding:1.5px;
  overflow:hidden;
  position:relative;
}

/* Screen */
.screen{
  width:100%;height:100%;
  border-radius:33.5px;
  overflow:hidden;
  background:#fff;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* Dynamic Island */
.di{
  position:absolute;
  top:10px;left:50%;transform:translateX(-50%);
  z-index:20;
  width:76px;height:23px;
  background:#0a0a0a;
  border-radius:999px;
  box-shadow:inset 0 0 0 0.5px rgba(255,255,255,.06);
}

/* Glass highlight */
.glass{
  position:absolute;inset:0;
  border-radius:33.5px;
  z-index:30;pointer-events:none;
  background:linear-gradient(148deg,
    rgba(255,255,255,.13) 0%,
    rgba(255,255,255,.06) 22%,
    transparent 40%
  );
}

/* ── Status bar ── */
.sbar{
  display:flex;align-items:center;justify-content:space-between;
  height:46px;
  padding:14px 18px 0;
  flex-shrink:0;
  background:#fff;
}
.sbar-t{font-size:9px;font-weight:700;color:#000;letter-spacing:-.4px}
.sbar-i{display:flex;align-items:center;gap:4px}

/* ── Instagram search nav ── */
.ig-nav{
  display:flex;align-items:center;
  padding:4px 6px 4px 4px;
  height:44px;
  flex-shrink:0;
  gap:4px;
  background:#fff;
}
.ig-back{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ig-searchbar{
  flex:1;
  display:flex;align-items:center;
  background:#efefef;
  border-radius:12px;
  padding:5px 10px;
  gap:5px;
  min-width:0;
  height:34px;
}
.ig-kw{
  font-size:8.5px;color:#262626;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1;flex:1;
}
.ig-more-btn{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* ── Tab bar ── */
.ig-tabs{
  display:flex;flex-shrink:0;
  background:#fff;
  border-bottom:0.5px solid #dbdbdb;
}
.ig-tab{
  flex:1;text-align:center;
  padding:9px 0 8px;
  font-size:7.5px;
  color:#8e8e8e;
  border-bottom:1.5px solid transparent;
  line-height:1;
  white-space:nowrap;
  letter-spacing:-.1px;
}
.ig-tab.on{
  color:#262626;
  border-bottom-color:#262626;
  font-weight:700;
}

/* ── Reels grid ── */
.gwrap{flex:1;overflow:hidden;background:#000;position:relative;min-height:0}
.gscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.gfade{position:absolute;bottom:0;left:0;right:0;height:32px;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;z-index:5}

.rcell{aspect-ratio:9/16;position:relative;overflow:hidden;cursor:pointer;background:#111;transition:opacity .15s}
.rcell:hover{opacity:.85}
.rcell-rank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:rgba(255,255,255,.15);z-index:0;pointer-events:none}
.rcell-thumb{position:absolute;inset:0;z-index:1}
.rcell-thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.rcell-thumb img.loaded{opacity:1}
.rcell-play{position:absolute;top:3px;right:3px;z-index:3;pointer-events:none}
.rcell-overlay{position:absolute;bottom:0;left:0;right:0;padding:3px 4px;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:3;pointer-events:none}
.rcell-views{font-size:5.5px;color:rgba(255,255,255,.9);font-weight:700;line-height:1}
.rcell.own{outline:2.5px solid var(--ig-pink);outline-offset:-2.5px;z-index:4}
.rcell.own::after{content:'自社';position:absolute;top:0;left:0;right:0;z-index:6;font-size:6px;font-weight:800;background:var(--ig-pink);color:white;padding:2px 4px;text-align:center;letter-spacing:.05em}
.rcell:hover .rtip{display:flex}
.rtip{display:none;flex-direction:column;gap:2px;position:absolute;inset:0;background:rgba(0,0,0,.92);padding:5px;z-index:10}
.rt-rank{font-size:8px;font-weight:800;color:var(--ig-pink)}
.rt-name{font-size:6px;font-weight:700;color:#aaa;margin-top:1px}
.rt-cap{font-size:5px;color:rgba(255,255,255,.7);line-height:1.4;flex:1;overflow:hidden;margin-top:2px}
.rt-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:3px}
.rt-stat{font-size:5.5px;color:#f09433;font-weight:700}

/* ── Bottom nav ── */
.ig-bnav{
  display:flex;align-items:center;justify-content:space-around;
  padding:6px 4px 5px;
  background:#fff;
  border-top:0.5px solid #dbdbdb;
  flex-shrink:0;
}
.ig-bni{display:flex;align-items:center;justify-content:center;width:38px;height:30px}

/* Home indicator */
.homeind{
  flex-shrink:0;
  height:22px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
}
.homeind-pill{width:108px;height:4px;background:#000;border-radius:999px;opacity:.18}

/* Stats panel */
.phone-stats{width:216px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ps-row{display:flex;justify-content:space-between;margin-bottom:5px}
.ps-item{text-align:center}
.ps-val{font-size:14px;font-weight:800;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps-lbl{font-size:9px;color:var(--muted)}
.ps-match{font-size:10px;font-weight:700;text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.ps-match.found{color:var(--ig-pink)}.ps-match.notfound{color:#bbb}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="white" stroke="none"/>
      </svg>
    </div>
    <span class="hdr-badge">VSEO ANALYTICS</span>
  </div>
  <div class="hdr-sub">Instagram リール検索結果 スマホモック</div>
  <div class="hdr-desc">各ハッシュタグのリール検索結果に自社投稿が含まれているか確認</div>
</div>

<div class="result-banner" id="rb"><div class="rb-title">読み込み中…</div></div>

<div class="legend">
  <div class="leg-item"><div class="leg-my"></div><span>自社投稿（赤枠 + 自社バッジ）</span></div>

</div>

<div class="phones-stage" id="stage"></div>

<script>
const MY_IDS = new Set([
  'DX308QwBi5u',
]);

const DATA = [
{tag:'#洗濯槽クリーナー', posts:[
  {sc:'DAndsupyhzR',n:'',c:'',v:'',rv:0},
  {sc:'C71FuB2PCds',n:'',c:'',v:'',rv:0},
  {sc:'DV8wkcSj_ZM',n:'',c:'',v:'',rv:0},
  {sc:'C4aURQ9vgM4',n:'',c:'',v:'',rv:0},

]},
{tag:'#洗濯', posts:[

]},
];

const PAL=[
  ['#f09433','#dc2743'],['#dc2743','#cc2366'],['#cc2366','#833ab4'],
  ['#833ab4','#5851db'],['#5851db','#405de6'],['#e6683c','#c13584'],
  ['#bc1888','#833ab4'],['#f09433','#e6683c'],['#c13584','#833ab4'],
];
function gc(i){const c=PAL[i%PAL.length];return`linear-gradient(135deg,${c[0]},${c[1]})`}

function loadAllThumbs(){
  document.querySelectorAll('img.igthumb').forEach(img=>{
    const cell=img.closest('[data-code]');
    if(!cell)return;
    const code=cell.dataset.code;
    const srcs=[
      `ig-thumbs/${code}.jpg`,
      `https://www.instagram.com/p/${code}/media/?size=m`,
      `https://www.instagram.com/reel/${code}/media/?size=m`,
    ];
    let idx=0;
    const next=()=>{
      if(idx>=srcs.length){img.style.display='none';return;}
      img.onload=()=>img.classList.add('loaded');
      img.onerror=()=>{idx++;next();};
      img.src=srcs[idx++];
    };
    next();
  });
}

function buildBanner(){
  const rb=document.getElementById('rb');
  const myCount=DATA.reduce((a,d)=>a+d.posts.filter(p=>MY_IDS.has(p.sc)).length,0);
  const rows=DATA.map(d=>{
    const hits=d.posts.filter(p=>MY_IDS.has(p.sc));
    if(hits.length){
      const ranks=hits.map(p=>d.posts.indexOf(p)+1);
      return`<div class="rb-kw"><strong>${d.tag}</strong> <span>✅ ${hits.length}件あり — ${ranks.map(r=>r+'位').join('・')}</span></div>`;
    }
    const label=d.posts.length?`❌ トップ${d.posts.length}件内に自社投稿なし`:'— データ未設定';
    return`<div class="rb-kw none"><strong>${d.tag}</strong> <span>${label}</span></div>`;
  }).join('');
  rb.innerHTML=`
    <div class="rb-title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#e1306c" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#e1306c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${myCount>0?`自社投稿 ${myCount}本 — 突合結果`:'自社投稿 突合結果'}
    </div>
    ${rows}
    <div class="rb-note">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="#999" stroke-width="1"/><path d="M6 5v3M6 4v.01" stroke="#999" stroke-width="1.2" stroke-linecap="round"/></svg>
      スクレイピングで取得したリール上位件数との突合
    </div>`;
}

function buildPhones(){
  const stage=document.getElementById('stage');
  stage.innerHTML=DATA.map((d,di)=>{
    const matchCount=d.posts.filter(p=>MY_IDS.has(p.sc)).length;
    const matchRanks=d.posts.filter(p=>MY_IDS.has(p.sc)).map(p=>d.posts.indexOf(p)+1);

    const cells=d.posts.length
      ? d.posts.map((p,i)=>{
          const own=MY_IDS.has(p.sc);
          const bg=gc(i+di*7);
          return`<a class="rcell${own?' own':''}" data-code="${p.sc}" href="https://www.instagram.com/reel/${p.sc}/" target="_blank">
            <div class="rcell-rank">${i+1}</div>
            <div class="rcell-thumb" style="background:${bg}"><img class="igthumb" src="" alt=""/></div>
            <div class="rcell-play">
              <svg width="9" height="9" viewBox="0 0 10 10" fill="white" opacity=".85"><path d="M2 1.5l7 3.5-7 3.5z"/></svg>
            </div>
            <div class="rcell-overlay">
              <div class="rcell-views">${p.v?'▶ '+p.v:''}</div>
            </div>
            <div class="rtip">
              <div class="rt-rank">第${i+1}位</div>
              ${p.n?`<div class="rt-name">@${p.n}</div>`:''}
              <div class="rt-cap">${p.c||''}</div>
              ${(p.v||p.likes)?`<div class="rt-stats">${p.v?`<span class="rt-stat">▶ ${p.v}</span>`:''} ${p.likes?`<span class="rt-stat">♥ ${p.likes}</span>`:''}</div>`:''}
            </div>
          </a>`;
        }).join('')
      : `<div style="grid-column:1/-1;padding:20px;text-align:center;font-size:8px;color:#555;background:#111">データ未設定</div>`;

    return`<div class="phone-card">
      <div class="phone-kw">${d.tag}</div>
      <div class="phone">
        <!-- side buttons -->
        <div class="phbtn phbtn-l0"></div>
        <div class="phbtn phbtn-l1"></div>
        <div class="phbtn phbtn-l2"></div>
        <div class="phbtn phbtn-r"></div>

        <div class="frame"><div class="bezel">

          <!-- glass sheen -->

          <div class="screen">

            <!-- ① Status bar -->

                <!-- cellular signal -->

                  <rect x="3.3" y="3.2" width="2.2" height="5.8" rx=".55"/>

                <!-- wifi -->

                  <path d="M3.2 5C4 4.1 5 3.6 6 3.6S8 4.1 8.8 5" stroke="black" stroke-width="1.1" stroke-linecap="round" fill="none"/>
                  <path d="M.6 2.6C2.1 1.1 4 .2 6 .2S9.9 1.1 11.4 2.6" stroke="black" stroke-width="1.1" stroke-linecap="round" fill="none"/>

                  <rect x=".5" y="1.2" width="20" height="6.6" rx="2" stroke="black" stroke-width=".9"/>
                  <rect x="21.2" y="3.2" width="2" height="2.6" rx="1" fill="black" opacity=".4"/>
                  <rect x="1.8" y="2.4" width="15" height="4.2" rx="1.2" fill="black"/>
                </svg>
              </div>
            </div>

            <!-- ② Search nav -->
            <div class="ig-nav">
              <div class="ig-back">
                <svg width="10" height="17" viewBox="0 0 10 17" fill="none">
                  <path d="M8.5 1L1.5 8.5 8.5 16" stroke="#262626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

              </div>
              <div class="ig-searchbar">
                <svg width="11" height="11" viewBox="0 0 13 13" fill="none">

                  <circle cx="9" cy="2" r="1.8"/>
                  <circle cx="16" cy="2" r="1.8"/>
                </svg>
              </div>
            </div>

            <!-- ③ Tabs -->
            <div class="ig-tabs">
              <div class="ig-tab on">おすすめ</div>
              <div class="ig-tab">プロフィール</div>
              <div class="ig-tab">音源</div>
              <div class="ig-tab">タグ</div>
            </div>

            <!-- ④ Grid -->
            <div class="gwrap">
              <div class="gscroll"><div class="rgrid">${cells}</div></div>
              <div class="gfade"></div>
            </div>

            <!-- ⑤ Bottom nav -->
            <div class="ig-bnav">
              <!-- Home -->
              <div class="ig-bni">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M3 10.8L12 3l9 7.8V21a1 1 0 01-1 1h-4.5v-5.5H8.5V22H4a1 1 0 01-1-1v-10.2z" stroke="#262626" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
              </div>
              <!-- Search (active — bolder stroke) -->
              <div class="ig-bni">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <circle cx="10.5" cy="10.5" r="7" stroke="#262626" stroke-width="2.2"/>
                  <path d="M16.2 16.2L21.5 21.5" stroke="#262626" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
              </div>
              <!-- New post -->
              <div class="ig-bni">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <rect x="2.5" y="2.5" width="19" height="19" rx="4" stroke="#262626" stroke-width="1.7"/>
                  <path d="M12 7.5v9M7.5 12h9" stroke="#262626" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
              <!-- Reels -->
              <div class="ig-bni">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <rect x="2" y="2" width="20" height="20" rx="5" stroke="#262626" stroke-width="1.7"/>
                  <circle cx="12" cy="12" r="3" stroke="#262626" stroke-width="1.7"/>
                  <path d="M2 8.5h20M8.5 2v6.5M15.5 2v6.5" stroke="#262626" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
              <!-- Profile -->
              <div class="ig-bni">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="3.8" stroke="#262626" stroke-width="1.7"/>
                  <path d="M4.5 21c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5" stroke="#262626" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

            <!-- ⑥ Home indicator -->
            <div class="homeind"><div class="homeind-pill"></div></div>

          </div><!-- /screen -->
        </div></div><!-- /bezel /frame -->
      </div><!-- /phone -->

      <div class="phone-stats">
        <div class="ps-row">
          <div class="ps-item"><div class="ps-val">${d.posts.length||'—'}</div><div class="ps-lbl">取得件数</div></div>
          <div class="ps-item"><div class="ps-val">${matchCount||'—'}</div><div class="ps-lbl">自社投稿</div></div>
          <div class="ps-item"><div class="ps-val">${matchRanks.length?matchRanks.map(r=>r+'位').join('·'):'—'}</div><div class="ps-lbl">順位</div></div>
        </div>
        <div class="ps-match ${matchCount>0?'found':'notfound'}">${matchCount>0?`✅ 自社投稿 ${matchCount}件あり`:d.posts.length?'❌ 自社投稿なし':'— データ未設定'}</div>
      </div>
    </div>`;
  }).join('');

  requestAnimationFrame(()=>loadAllThumbs());
}

buildBanner();
buildPhones();
</script>
</body>
</html>
