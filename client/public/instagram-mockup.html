*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--surface:#f8f8f8;--border:#e5e5e5;--ig-pink:#e1306c;--ig-grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);--text:#111;--muted:#888}
body{font-family:-apple-system,'Hiragino Sans',BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px 24px 80px}

.hdr{text-align:center;margin-bottom:24px}
.hdr-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-icon{width:28px;height:28px;border-radius:8px;background:var(--ig-grad);display:flex;align-items:center;justify-content:center}
.hdr-badge{font-size:11px;font-weight:700;letter-spacing:.15em;color:#999}
.hdr-sub{font-size:24px;font-weight:900;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-desc{font-size:12px;color:var(--muted);margin-top:6px}

.result-banner{max-width:900px;margin:0 auto 22px;background:#fff5f8;border:1.5px solid var(--ig-pink);border-radius:12px;padding:16px 22px}
.rb-title{font-size:13px;font-weight:800;color:var(--ig-pink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rb-kw{font-size:12px;margin-bottom:6px}
.rb-kw strong{color:var(--ig-pink)}
.rb-kw span{color:#333}
.rb-kw.none strong{color:#bbb}
.rb-kw.none span{color:#bbb}
.rb-note{font-size:11px;color:#999;margin-top:10px;padding-top:10px;border-top:1px solid #fce;display:flex;align-items:center;gap:6px}

.legend{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg-my{width:14px;height:14px;border-radius:3px;border:2.5px solid var(--ig-pink);background:#fff5f8;position:relative;flex-shrink:0}
.leg-my::after{content:'自社';position:absolute;top:-1px;left:-1px;font-size:4.5px;font-weight:800;background:var(--ig-pink);color:white;padding:1px 2px;border-radius:2px}
.leg-normal{width:14px;height:14px;border-radius:3px;background:#f0f0f0;border:1px solid #ddd;flex-shrink:0}

.phones-stage{display:flex;gap:20px;justify-content:center;align-items:flex-start;overflow-x:auto;padding:4px 0 16px}
.phone-card{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 auto}
.phone-kw{font-size:11px;font-weight:700;color:#555;background:var(--surface);border:1px solid var(--border);padding:4px 14px;border-radius:999px}

/* iPhone 15 Pro frame — identical to TikTok mockup */
.phone{position:relative;width:216px;height:468px;filter:drop-shadow(0 10px 28px rgba(0,0,0,.18))}
.bl1,.bl2,.bl3{position:absolute;left:-3px;border-radius:1.5px 0 0 1.5px;width:3px;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.bl1{top:76px;height:15px}.bl2{top:104px;height:20px}.bl3{top:129px;height:20px}
.br1{position:absolute;right:-3px;top:112px;width:3px;height:24px;border-radius:0 1.5px 1.5px 0;background:linear-gradient(180deg,#48484a,#2c2c2e)}
.frame{width:100%;height:100%;border-radius:30px;padding:3px;background:linear-gradient(160deg,#48484a,#3a3a3c 15%,#2c2c2e 40%,#1c1c1e 60%,#2c2c2e 80%,#3a3a3c)}
.bezel{width:100%;height:100%;border-radius:28px;border:1px solid #050505;background:#fff;overflow:hidden;position:relative}
.di{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:20;width:64px;height:18px;background:black;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.glass{position:absolute;inset:0;border-radius:26px;z-index:30;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 30%,transparent 50%)}
.screen{width:100%;height:100%;border-radius:26px;overflow:hidden;background:#fff;display:flex;flex-direction:column}

/* Status bar (light theme) */
.sbar{display:flex;align-items:center;justify-content:space-between;padding:0 17px;height:28px;flex-shrink:0;background:#fff}
.sbar-t{font-size:8.5px;font-weight:700;color:#000;margin-top:10px;letter-spacing:-.3px}
.sbar-i{display:flex;align-items:center;gap:2.5px;margin-top:10px;font-size:7px;color:#000}

/* Instagram top nav */
.ig-topbar{display:flex;align-items:center;padding:0 10px;height:36px;border-bottom:1px solid #dbdbdb;flex-shrink:0}
.ig-back{font-size:18px;color:#262626;margin-right:8px;line-height:1}
.ig-topbar-title{font-size:11px;font-weight:700;color:#262626;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig-topbar-more{font-size:14px;color:#262626}

/* Hashtag header */
.ig-hdr{display:flex;gap:10px;align-items:center;padding:10px 10px 8px;flex-shrink:0}
.ig-hdr-icon{width:48px;height:48px;border-radius:50%;background:var(--ig-grad);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.ig-hdr-info h3{font-size:11px;font-weight:700;color:#262626}
.ig-hdr-info p{font-size:9px;color:#8e8e8e;margin-top:1px}
.ig-follow{margin-top:4px;background:#0095f6;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:9px;font-weight:600}

/* Tabs */
.ig-tabs{display:flex;border-bottom:1px solid #dbdbdb;flex-shrink:0}
.ig-tab{flex:1;text-align:center;padding:7px 0;font-size:8.5px;color:#8e8e8e;cursor:pointer;border-bottom:1.5px solid transparent}
.ig-tab.on{color:#262626;border-bottom:1.5px solid #262626;font-weight:700}

/* Grid */
.gwrap{flex:1;overflow:hidden;position:relative}
.gscroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.gscroll::-webkit-scrollbar{display:none}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.gfade{position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(transparent,white);pointer-events:none;z-index:5}

/* Post cell */
.pcell{aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;display:block}
.pcell:hover{opacity:.85}
.pcell-thumb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:rgba(255,255,255,.8)}
.pcell-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .4s}
.pcell-thumb img.loaded{opacity:1}
.pcell-overlay{position:absolute;bottom:0;left:0;right:0;padding:3px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:2}
.pcell-cap{font-size:4.5px;color:rgba(255,255,255,.85);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcell:hover .ptip{display:flex}
.ptip{display:none;flex-direction:column;gap:2px;position:absolute;inset:0;background:rgba(0,0,0,.88);padding:5px;z-index:10}
.pt-rank{font-size:8px;font-weight:800;color:var(--ig-pink)}
.pt-cap{font-size:5px;color:rgba(255,255,255,.75);line-height:1.4;flex:1;overflow:hidden}

/* Own post highlight */
.pcell.own{outline:3px solid var(--ig-pink);outline-offset:-3px;z-index:4}
.pcell.own::after{content:'自社';position:absolute;top:0;left:0;right:0;z-index:5;font-size:6px;font-weight:800;background:var(--ig-pink);color:white;padding:2px 4px;text-align:center;letter-spacing:.05em}

/* Stats panel */
.phone-stats{width:216px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ps-row{display:flex;justify-content:space-between;margin-bottom:5px}
.ps-item{text-align:center}
.ps-val{font-size:14px;font-weight:800;background:var(--ig-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps-lbl{font-size:9px;color:var(--muted)}
.ps-match{font-size:10px;font-weight:700;text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.ps-match.found{color:var(--ig-pink)}.ps-match.notfound{color:#bbb}
</style>
</head>

// Thumbnail: try Instagram /media/ redirect via img tag (no CORS on img tags)
// falls back to gradient if blocked
const thumbQueue=[];
let thumbIdx=0;
const thumbCache={};

function applyThumb(code, src){
  document.querySelectorAll(`[data-code="${code}"] img.igthumb`).forEach(img=>{
    img.src=src;
    img.onload=()=>img.classList.add('loaded');
    img.onerror=()=>{img.style.display='none'};
  });
}

async function pumpThumbs(){
  while(thumbIdx<thumbQueue.length){
    const {code}=thumbQueue[thumbIdx++];
    if(thumbCache[code]){applyThumb(code,thumbCache[code]);continue;}
    // Try Instagram oembed (may work for some public posts)
    try{
      const r=await fetch(`https://api.instagram.com/oembed/?url=https://www.instagram.com/p/${code}/&format=json`,{mode:'cors'});
      if(r.ok){
        const d=await r.json();
        if(d.thumbnail_url){thumbCache[code]=d.thumbnail_url;applyThumb(code,d.thumbnail_url);continue;}
      }
    }catch(e){}
    // Fallback: direct media URL (img tags bypass CORS)
    const src=`https://www.instagram.com/p/${code}/media/?size=m`;
    thumbCache[code]=src;
    applyThumb(code,src);
  }
}

function buildBanner(){
  const rb=document.getElementById('rb');
  const rows=DATA.map(d=>{
    const hits=d.posts.filter(p=>MY_IDS.has(p.u));
    if(hits.length){
      const ranks=hits.map(p=>d.posts.indexOf(p)+1);
      return`<div class="rb-kw"><strong>${d.tag}</strong> <span>✅ ${hits.length}件あり — ${ranks.map(r=>r+'位').join('・')}</span></div>`;
    }
    return`<div class="rb-kw none"><strong>${d.tag}</strong> <span>❌ トップ${d.posts.length}件内に自社投稿なし</span></div>`;
  }).join('');
  rb.innerHTML=`
    <div class="rb-title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#e1306c" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#e1306c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      自社投稿 19本 — 突合結果
    </div>
    ${rows}
    <div class="rb-note">※ 自社投稿と突合したのはスクレイピングで取得した上位件数のみ</div>`;
}

function buildPhones(){
  const stage=document.getElementById('stage');
  stage.innerHTML=DATA.map((d,di)=>{
    const matchCount=d.posts.filter(p=>MY_IDS.has(p.u)).length;
    const cells=d.posts.map((p,i)=>{
      const own=MY_IDS.has(p.u);
      thumbQueue.push({code:p.u});
      return`<a class="pcell${own?' own':''}" data-code="${p.u}" href="https://www.instagram.com/p/${p.u}/" target="_blank">
        <div class="pcell-thumb" style="background:${gc(i+di*7)}"><span>${i+1}</span><img class="igthumb" src="" alt="" loading="lazy"/></div>
        <div class="pcell-overlay"><div class="pcell-cap">${p.c}</div></div>
        <div class="ptip">
          <div class="pt-rank">第${i+1}位</div>
          <div class="pt-cap">${p.c}</div>
        </div>
      </a>`;
    }).join('');

    return`<div class="phone-card">
      <div class="phone-kw">${d.tag}</div>
      <div class="phone">
        <div class="bl1"></div><div class="bl2"></div><div class="bl3"></div>
        <div class="br1"></div>
        <div class="frame">
          <div class="bezel">
            <div class="di"></div>
            <div class="glass"></div>
            <div class="screen">
              <div class="sbar">
                <span class="sbar-t">9:41</span>
                <div class="sbar-i">▌▌▌ ⌾ ▮▮</div>
              </div>
              <div class="ig-topbar">
                <span class="ig-back">‹</span>
                <span class="ig-topbar-title">${d.tag}</span>
                <span class="ig-topbar-more">⋯</span>
              </div>
              <div class="ig-hdr">
                <div class="ig-hdr-icon">#</div>
                <div class="ig-hdr-info">
                  <h3>${d.tag}</h3>
                  <p>${d.posts.length}件の投稿</p>
                  <button class="ig-follow">フォロー</button>
                </div>
              </div>
              <div class="ig-tabs">
                <div class="ig-tab on">投稿</div>
                <div class="ig-tab">リール</div>
                <div class="ig-tab">タグ付け</div>
              </div>
              <div class="gwrap">
                <div class="gscroll">
                  <div class="igrid">${cells}</div>
                </div>
                <div class="gfade"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="phone-stats">
        <div class="ps-row">
          <div class="ps-item"><div class="ps-val">${d.posts.length}</div><div class="ps-lbl">取得件数</div></div>
          <div class="ps-item"><div class="ps-val">${matchCount||'—'}</div><div class="ps-lbl">自社投稿</div></div>
          <div class="ps-item"><div class="ps-val">${matchCount>0?d.posts.filter(p=>MY_IDS.has(p.u)).map(p=>d.posts.indexOf(p)+1+'位').join('·'):'—'}</div><div class="ps-lbl">順位</div></div>
        </div>
        <div class="ps-match ${matchCount>0?'found':'notfound'}">${matchCount>0?`✅ 自社投稿 ${matchCount}件あり`:'❌ 自社投稿なし'}</div>
      </div>
    </div>`;
  }).join('');

  // Start thumbnail loading after DOM is ready
  requestAnimationFrame(()=>pumpThumbs());
}

buildBanner();
buildPhones();
