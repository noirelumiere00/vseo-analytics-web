*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;padding:36px 20px;color:#262626}

.phone-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.kw-label{font-size:13px;font-weight:700;color:#262626;text-align:center;letter-spacing:.02em}

/* iPhone 15 Pro frame */
.iphone{width:252px;height:544px;background:#1c1c1e;border-radius:48px;padding:11px;box-shadow:0 0 0 1px #3a3a3c,0 24px 64px rgba(0,0,0,.45),inset 0 0 0 1px #555;position:relative;flex-shrink:0}
.iphone::before{content:'';position:absolute;right:-3px;top:96px;width:3px;height:56px;background:#3a3a3c;border-radius:0 3px 3px 0;box-shadow:0 76px 0 #3a3a3c}
.iphone::after{content:'';position:absolute;left:-3px;top:76px;width:3px;height:32px;background:#3a3a3c;border-radius:3px 0 0 3px;box-shadow:0 48px 0 #3a3a3c,0 92px 0 #3a3a3c}
.screen{width:100%;height:100%;background:#fff;border-radius:38px;overflow:hidden;display:flex;flex-direction:column}

/* Dynamic Island */
.di{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:28px;background:#000;border-radius:18px;z-index:10}

/* Status bar */
.sbar{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 8px;flex-shrink:0;background:#fff}
.sbar-time{font-size:11px;font-weight:600}
.sbar-icons{font-size:10px;display:flex;gap:3px;align-items:center}

/* Instagram nav */
.ig-nav{height:42px;border-bottom:1px solid #dbdbdb;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.ig-back{font-size:22px;color:#262626;line-height:1;cursor:pointer}
.ig-nav-title{font-size:13px;font-weight:700;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ig-nav-more{font-size:16px;color:#262626}

/* Header */
.ig-head{padding:12px 14px;display:flex;gap:12px;align-items:center;flex-shrink:0}
.ig-head-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ig-head-info h2{font-size:13px;font-weight:700}
.ig-head-info p{font-size:11px;color:#8e8e8e;margin-top:2px}
.ig-follow{margin-top:6px;background:#0095f6;color:#fff;border:none;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:600;cursor:pointer}

/* Tabs */
.ig-tabs{display:flex;border-bottom:1px solid #dbdbdb;flex-shrink:0}
.ig-tab{flex:1;text-align:center;padding:9px 0;font-size:10px;color:#8e8e8e;cursor:pointer;border-bottom:1px solid transparent}
.ig-tab.on{color:#262626;border-bottom:1px solid #262626;font-weight:600}

/* Grid */
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow-y:auto;flex:1}
.ig-grid::-webkit-scrollbar{width:2px}
.ig-grid::-webkit-scrollbar-thumb{background:#dbdbdb;border-radius:2px}
.ig-cell{aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;text-decoration:none}
.ig-cell-bg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.ig-rank{font-size:16px;font-weight:800;color:rgba(255,255,255,.95);line-height:1}
.ig-cap{font-size:5px;color:rgba(255,255,255,.85);text-align:center;line-height:1.4;margin-top:3px;max-height:26px;overflow:hidden;word-break:break-all}
/* Own post highlight */
.ig-cell.own{outline:3px solid #e1306c;outline-offset:-3px;z-index:4}
.ig-cell.own::after{content:'自社';position:absolute;top:0;left:0;right:0;z-index:5;font-size:6px;font-weight:800;background:#e1306c;color:#fff;padding:2px 4px;text-align:center;letter-spacing:.05em}
/* Banner */
.banner{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.banner-item{display:flex;align-items:center;gap:6px;background:#f8f8f8;border:1px solid #ebebeb;border-radius:20px;padding:6px 14px;font-size:12px}
.banner-tag{font-weight:700;color:#262626}
.banner-ok{color:#e1306c;font-weight:700}
.banner-ng{color:#8e8e8e}

/* Stats */
.stats{width:252px;background:#f8f8f8;border:1px solid #ebebeb;border-radius:12px;padding:12px 14px}
.stats-tag{font-size:13px;font-weight:700;margin-bottom:8px}
.stats-row{display:flex;justify-content:space-between;font-size:11px;color:#8e8e8e;margin-top:3px}
.stats-val{font-weight:600;color:#262626}
</style>

function render(){
  const root=document.getElementById('root');

  // Build banner
  const bannerHtml=DATA.map(d=>{
    const matches=d.posts.filter(p=>MY_IDS.has(p.u));
    const ok=matches.length>0;
    return`<div class="banner-item">
      <span class="banner-tag">${d.tag}</span>
      ${ok
        ?`<span class="banner-ok">✅ ${matches.length}件あり（${matches.map((_,i)=>d.posts.indexOf(matches[i])+1+'位').join('・')}）</span>`
        :`<span class="banner-ng">❌ なし</span>`}
    </div>`;
  }).join('');
  document.getElementById('banner').innerHTML=bannerHtml;

  root.innerHTML=DATA.map((d,di)=>{
    const cells=d.posts.map((p,i)=>{
      const own=MY_IDS.has(p.u);
      return`<a class="ig-cell${own?' own':''}" href="https://www.instagram.com/reel/${p.u}/" target="_blank" title="${p.c}">
        <div class="ig-cell-bg" style="background:${gc(i+di*7)}">
          <div class="ig-rank">${i+1}</div>
          <div class="ig-cap">${p.c.slice(0,36)}</div>
        </div>
      </a>`;
    }).join('');

    const matchCount=d.posts.filter(p=>MY_IDS.has(p.u)).length;

    return`<div class="phone-col">
      <div class="kw-label">${d.tag}</div>
      <div class="iphone">
        <div class="di"></div>
        <div class="screen">
          <div class="sbar">
            <span class="sbar-time">9:41</span>
            <div class="sbar-icons">▌▌▌ ⌾ ▮▮</div>
          </div>
          <div class="ig-nav">
            <span class="ig-back">‹</span>
            <span class="ig-nav-title">${d.tag}</span>
            <span class="ig-nav-more">⋯</span>
          </div>
          <div class="ig-head">
            <div class="ig-head-icon">#</div>
            <div class="ig-head-info">
              <h2>${d.tag}</h2>
              <p>${d.posts.length}件の投稿</p>
              <button class="ig-follow">フォロー</button>
            </div>
          </div>
          <div class="ig-tabs">
            <div class="ig-tab on">投稿</div>
            <div class="ig-tab">リール</div>
            <div class="ig-tab">タグ付け</div>
          </div>
          <div class="ig-grid">${cells}</div>
        </div>
      </div>
      <div class="stats">
        <div class="stats-tag">${d.tag}</div>
        <div class="stats-row"><span>取得件数</span><span class="stats-val">${d.posts.length}件</span></div>
        <div class="stats-row"><span>自社投稿</span><span class="stats-val">${matchCount>0?matchCount+'件あり':'なし'}</span></div>
        <div class="stats-row"><span>調査日</span><span class="stats-val">2026年5月</span></div>
      </div>
    </div>`;
  }).join('');
}
render();
</script>
